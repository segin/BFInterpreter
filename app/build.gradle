apply plugin: 'com.android.application'

android {
    namespace 'org.segin.bfinterpreter'
    compileSdkVersion 34

    defaultConfig {
        applicationId "org.segin.bfinterpreter"
        minSdkVersion 14
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    // Modern Android development requires at least Java 8.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // It's good practice to use recent versions of libraries.
    implementation 'androidx.appcompat:appcompat:1.6.1'
}